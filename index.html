<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Armchair All Stars</title>
    <meta name="description" content="Armchair All Stars — Market Making | Research">
    <meta name="theme-color" content="#0B0B0B">
    <meta property="og:title" content="Armchair All Stars">
    <meta property="og:description" content="Market Making | Research">
    <meta property="og:url" content="https://armchairallstars.com/">
    <meta property="og:image" content="https://armchairallstars.com/assets/logo.jpg">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <style>
        :root {
            --ink: #0B0B0B;
            --ink-deep: #000000;
            --red: #D7191F;
            --red-dim: #8E1216;
            --white: #F4F1EC;
            --grey: #9A9590;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::selection { background: var(--red); color: var(--white); }

        html, body { height: 100%; }

        body {
            min-height: 100%;
            /* Flat black: the logo JPG has a solid black background, so any gradient shows its edges. */
            background-color: var(--ink-deep);
            color: var(--grey);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: grid;
            place-items: center;
            padding: 40px 16px;
        }

        .frame {
            position: fixed;
            inset: 16px;
            border: 1px solid var(--red-dim);
            pointer-events: none;
        }

        main {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .logo {
            width: min(250px, 70vw);
            height: auto;
            display: block;
        }

        h1 {
            color: var(--white);
            font-weight: 300;
            font-size: clamp(26px, 6vw, 40px);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .rule {
            width: 56px;
            height: 2px;
            background: var(--red);
        }

        .tagline {
            font-size: 12px;
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }

        .contact {
            font-size: 12px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--white);
            text-decoration: none;
            border: 1px solid var(--red);
            padding: 12px 22px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .contact:hover, .contact:focus-visible {
            background: var(--red);
            color: var(--white);
            outline: none;
        }

        footer {
            position: fixed;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #5E5A56;
        }
    </style>
</head>
<body>
    <div class="frame" aria-hidden="true"></div>
    <main>
        <img class="logo" src="assets/logo.jpg" alt="Armchair All Stars logo: a red armchair with a white star">
        <h1>Armchair All Stars</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="tagline">Market Making&nbsp;&nbsp;|&nbsp;&nbsp;Research</p>
        <a class="contact" href="mailto:bryce@armchairallstars.com">Contact</a>
    </main>
    <footer>&copy; 2026 Armchair All Stars LLC</footer>
</body>
</html>
